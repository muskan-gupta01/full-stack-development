<!DOCTYPE html>
<html>
<head>
    <title>Student Information</title>
</head>
<body>

    <table border="1" cellpadding="10" cellspacing="0">
        <caption><b>Student Information</b></caption>

        <tr>
            <th rowspan="2">Info</th>
            <th rowspan="2">Name</th>
            <th colspan="2">Address</th>
        </tr>

        <tr>
            <th>City</th>
            <th>House</th>
        </tr>

        <tr>
            <td rowspan="4"></td>
            <td>A</td>
            <td>Delhi</td>
            <td>1</td>
        </tr>

        <tr>
            <td>B</td>
            <td>Mumbai</td>
            <td>2</td>
        </tr>

        <tr>
            <td>C</td>
            <td>Kolkata</td>
            <td>3</td>
        </tr>

        <tr>
            <td>D</td>
            <td>Pune</td>
            <td>4</td>
        </tr>

    </table>

</body>
</html>
